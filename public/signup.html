<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — TaskFlow Pro</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --surface: #ffffff;
      --bg: #f8fafc;
      --error: #ef4444;
      --success: #10b981;
      --radius: 12px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: var(--surface);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.15);
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 12px;
    }

    .logo h1 { font-size: 22px; font-weight: 700; color: var(--text); }
    .logo p { font-size: 14px; color: var(--text-muted); margin-top: 4px; }

    .free-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f0fdf4;
      color: var(--success);
      border: 1px solid #bbf7d0;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      margin-top: 8px;
    }

    .form-group { margin-bottom: 20px; }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      font-size: 15px;
      color: var(--text);
      transition: border-color 0.2s;
      outline: none;
      background: var(--bg);
    }

    input:focus { border-color: var(--primary); background: #fff; }

    .error-msg {
      background: #fef2f2;
      color: var(--error);
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
    }

    .error-msg.show { display: block; }

    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary), #8b5cf6);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
      margin-top: 4px;
    }

    .btn:hover { opacity: 0.92; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .terms {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 14px;
      line-height: 1.5;
    }

    .divider {
      text-align: center;
      margin: 24px 0 20px;
      color: var(--text-muted);
      font-size: 14px;
      position: relative;
    }

    .divider::before, .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 42%;
      height: 1px;
      background: var(--border);
    }

    .divider::before { left: 0; }
    .divider::after { right: 0; }

    .link-row {
      text-align: center;
      font-size: 14px;
      color: var(--text-muted);
    }

    .link-row a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .link-row a:hover { text-decoration: underline; }

    .back-link {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
    }

    .back-link a { color: var(--text-muted); text-decoration: none; }
    .back-link a:hover { color: var(--text); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">⚡</div>
      <h1>TaskFlow Pro</h1>
      <p>Your permanent productivity butler.</p>
      <div class="free-badge">✓ Free forever — no card required</div>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <form id="signupForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 6 characters" required autocomplete="new-password" />
      </div>
      <div class="form-group">
        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" placeholder="Confirm your password" required autocomplete="new-password" />
      </div>
      <button type="submit" class="btn" id="submitBtn">Create Free Account</button>
      <p class="terms">By signing up, you agree to our Terms of Service and Privacy Policy.</p>
    </form>

    <div class="divider">already have an account?</div>

    <div class="link-row">
      <a href="/login">Sign in instead</a>
    </div>

    <div class="back-link">
      <a href="/">← Back to TaskFlow Pro</a>
    </div>
  </div>

  <script>
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.classList.remove('show');

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      if (password !== confirm) {
        errorMsg.textContent = 'Passwords do not match.';
        errorMsg.classList.add('show');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating account...';

      try {
        const res = await fetch('/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = '/app';
        } else {
          errorMsg.textContent = data.error || 'Signup failed. Please try again.';
          errorMsg.classList.add('show');
          btn.disabled = false;
          btn.textContent = 'Create Free Account';
        }
      } catch (err) {
        errorMsg.textContent = 'Something went wrong. Please try again.';
        errorMsg.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Create Free Account';
      }
    });
  </script>
</body>
</html>
